<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>preview 390x844</title>
<style>
  html,body{margin:0;padding:0;background:#e9eef4}
  #wrap{width:390px;height:844px;margin:0 auto;background:#fff;overflow:hidden;position:relative}
  iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="/guide/?v=5&embed=1"></iframe></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var sel = q.get('s');
  var openBook = q.get('open');
  var y = parseInt(q.get('y') || '0', 10);
  var f = document.getElementById('f');
  f.addEventListener('load', function(){
    try{
      var d = f.contentDocument;
      if(openBook && d){ var b = d.querySelector('.book'); if(b) b.open = true; }
      if(sel && d){
        var el = d.querySelector(sel);
        if(el) el.scrollIntoView({block:'start'});
      }
      if(y){ f.contentWindow.scrollTo(0, y); }
    }catch(e){}
  });
})();
</script>
</body>
</html>
