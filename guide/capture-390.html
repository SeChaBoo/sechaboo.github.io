<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>capture 390</title>
<style>
html,body{margin:0;padding:0;background:#dfe6ee}
body{display:flex;justify-content:center;align-items:flex-start}
iframe{width:390px;height:844px;border:0;display:block;background:#fff}
</style></head>
<body>
<iframe id="f" scrolling="no"></iframe>
<script>
var p=new URLSearchParams(location.search), f=document.getElementById('f');
f.src='index.html?v='+(p.get('v')||'1');
f.addEventListener('load',function(){
  var h=p.get('h'); if(!h) return;
  var d=f.contentDocument, el=d.getElementById(h); if(!el) return;
  f.contentWindow.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - 72));
});
</script>
</body></html>
