<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>390x844 preview</title>
<style>html,body{margin:0;padding:0;background:#dde6ee}
#f{display:block;width:390px;height:844px;border:0;background:#fff}</style>
</head><body>
<iframe id="f" src="./index.html?v=2"></iframe>
<script>
document.getElementById('f').addEventListener('load',function(){
  try{
    var w=this.contentWindow, d=this.contentDocument;
    var box=d.querySelector('.bookwrap'), det=d.querySelector('.bookwrap details');
    if(det){ det.open=true; }
    if(box){ var y=box.getBoundingClientRect().top + w.scrollY - 96; w.scrollTo(0, Math.max(0,y)); }
  }catch(e){}
});
</script>
</body></html>
