<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>v7 390 capture</title>
<style>html,body{margin:0;padding:0;background:#cfd8e3;overflow:hidden}iframe{width:390px;border:0;display:none;position:absolute;left:0;top:0;background:#fff}iframe.on{display:block}</style></head>
<body>
<iframe id="f1" src="./guide/?v=7c#service" data-off="-10" style="height:844px"></iframe>
<iframe id="f2" src="./guide/?v=7c#service" data-sel="svcSec" data-h="1500" style="height:1500px"></iframe>
<iframe id="f3" src="./guide/?v=7c#price" data-act="pickup" data-off="0" style="height:844px"></iframe>
<iframe id="f4" src="./guide/?v=7c#price" data-act="pickup" data-sel="care" data-off="-260" style="height:844px"></iframe>
<script>
var n=(new URLSearchParams(location.search)).get('i')||'1';
var f=document.getElementById('f'+n);
if(f) f.className='on';
function go(ff){
  try{
    var d=ff.contentWindow.document;
    var act=ff.getAttribute('data-act');
    if(act){ var b=d.querySelector('[data-svc="'+act+'"]'); if(b) b.click(); }
    setTimeout(function(){
      var sel=ff.getAttribute('data-sel');
      var off=parseInt(ff.getAttribute('data-off'),10)||0;
      var y=0;
      if(sel==='svcSec'){ y=d.getElementById('service').getBoundingClientRect().top+ff.contentWindow.scrollY; }
      else if(sel && d.getElementById(sel)){ y=d.getElementById(sel).getBoundingClientRect().top+ff.contentWindow.scrollY+off; }
      else { var h=location.hash; }
      if(sel==='svcSec'){ ff.contentWindow.scrollTo({top:y,behavior:'instant'}); }
      else if(sel){ ff.contentWindow.scrollTo({top:y,behavior:'instant'}); }
      else {
        var el=d.querySelector('#'+(ff.src.split('#')[1]||'home'));
        if(el) ff.contentWindow.scrollTo({top:el.getBoundingClientRect().top+ff.contentWindow.scrollY+off,behavior:'instant'});
      }
    },400);
  }catch(e){ document.title='ERR '+e.message; }
}
document.querySelectorAll('iframe').forEach(function(ff){ ff.addEventListener('load',function(){ setTimeout(function(){go(ff);},300); }); });
</script>
</body></html>
