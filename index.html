<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#11161c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="번호판 가리개" />
<meta name="description" content="세차를부탁해 시공 사진의 번호판을 1초에 가려 주는 도구. 사진을 고르고 파란 점 4개만 맞추면 번호판 스티커가 자동으로 덮입니다." />
<meta property="og:title" content="세차를부탁해 번호판 가리개" />
<meta property="og:description" content="차량 사진만 고르면 번호판이 1초에 가려집니다." />
<title>세차를부탁해 번호판 가리개</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #11161c; color: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    padding: 12px 16px; background: #182028; border-bottom: 1px solid #26313d;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .badge { font-size: 11px; background: #1d4ed8; color: #fff; padding: 3px 8px; border-radius: 999px; }
  .toolbar {
    padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; background: #151c24; border-bottom: 1px solid #26313d;
  }
  button, .file-btn {
    appearance: none; border: 1px solid #334155; background: #1e293b; color: #f8fafc;
    padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button.primary, .file-btn.primary { background: #2563eb; border-color: #2563eb; }
  button.success { background: #059669; border-color: #059669; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  /* iOS 사파리에서 label 클릭으로 파일 선택창이 확실히 열리도록 display:none 대신 화면 밖에 둡니다 */
  input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .thumbs {
    display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; background: #0f1419;
    border-bottom: 1px solid #26313d; min-height: 64px; align-items: center;
  }
  .thumb {
    position: relative; width: 52px; height: 52px; flex: 0 0 auto; border-radius: 8px;
    overflow: hidden; border: 2px solid transparent; cursor: pointer; opacity: 0.7;
  }
  .thumb.active { border-color: #3b82f6; opacity: 1; }
  .thumb.done::after {
    content: "✓"; position: absolute; right: 2px; bottom: 2px; background: #10b981; color: #fff;
    font-size: 10px; font-weight: 800; width: 16px; height: 16px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .stage-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; overflow: hidden;
  }
  canvas {
    max-width: 100%; max-height: 68vh; border-radius: 10px; touch-action: none;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45); background: #0b0f14;
  }
  .hint {
    text-align: center; font-size: 12px; color: #94a3b8; padding: 6px 12px 12px;
  }
  .empty {
    text-align: center; color: #94a3b8; padding: 36px 20px; line-height: 1.6;
  }
  .empty img { width: 200px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #334155; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; color: #f8fafc;
    font-size: 13px; padding: 10px 14px; border-radius: 10px; max-width: 86vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 20; line-height: 1.4;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <h1>🚗 세차를부탁해 번호판 가리개</h1>
    <span class="badge">오프라인 1초 처리</span>
  </header>

  <div class="toolbar">
    <label class="file-btn primary">
      📷 차량 사진 고르기
      <input id="photoInput" type="file" accept="image/*" multiple />
    </label>
    <button id="autoBtn" disabled>✨ 자동 위치</button>
    <button id="resetBtn" disabled>↺ 가운데</button>
    <button id="saveOneBtn" class="success" disabled>⬇ 이 사진 저장</button>
    <button id="saveAllBtn" class="success" disabled>📦 전체 저장</button>
    <label class="file-btn" title="번호판 이미지 교체">
      🖼 스티커 교체
      <input id="stickerInput" type="file" accept="image/*" />
    </label>
  </div>

  <div class="thumbs" id="thumbs">
    <span style="font-size:12px;color:#64748b;">사진을 여러 장 고르면 여기에 목록이 뜹니다.</span>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <div class="empty" id="emptyBox">
      <img id="previewSticker" alt="세차를 부탁해 번호판" /><br />
      <b>'세차를 부탁해'</b> 번호판 스티커가 기본 내장돼 있어요.<br />
      위에서 <b>📷 차량 사진 고르기</b>를 눌러 사진(여러 장 가능)을 선택하세요!<br />
      파란 점 4개를 번호판 네 꼭짓점에 맞추면 각도까지 자동으로 기울어져 덮입니다.
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div class="hint" id="hint">파란 점 4개를 번호판 네 모서리에 드래그하거나, 박스 안을 드래그해 통째로 이동하세요.<br />아이폰은 <b>이 사진 저장</b>을 누르면 공유창이 뜨고, <b>'이미지 저장'</b>을 고르면 사진 앱에 저장됩니다.</div>

function defaultCorners(w, h) {
  const pw = w * 0.26;
  const ph = pw * (stickerImg.height / (stickerImg.width || 1) || 0.22);
  const cx = w * 0.5, cy = h * 0.62;
  return [
    { x: cx - pw / 2, y: cy - ph / 2 },
    { x: cx + pw / 2, y: cy - ph / 2 },
    { x: cx + pw / 2, y: cy + ph / 2 },
    { x: cx - pw / 2, y: cy + ph / 2 },
  ];
}

function autoDetectPlate(img) {
  const sw = 320;
  const scale = sw / img.width;
  const sh = Math.round(img.height * scale);
  const off = document.createElement("canvas");
  off.width = sw; off.height = sh;
  const octx = off.getContext("2d");
  octx.drawImage(img, 0, 0, sw, sh);
  const data = octx.getImageData(0, 0, sw, sh).data;

  // Score bright neutral-white rectangles that contain dark text edges (a licence plate),
  // searching the lower-middle part of the photo.
  const yStart = Math.floor(sh * 0.32), yEnd = Math.floor(sh * 0.86);
  const xStart = Math.floor(sw * 0.12), xEnd = Math.floor(sw * 0.88);
  const bw = Math.max(36, Math.round(sw * 0.20));
  const bh = Math.max(10, Math.round(bw * 0.23));
  let bestScore = -1, bestX = 0, bestY = 0, found = false;

  for (let y = yStart; y < yEnd - bh; y += 4) {
    for (let x = xStart; x < xEnd - bw; x += 4) {
      let bright = 0, edges = 0, count = 0;
      for (let dy = 0; dy < bh; dy += 2) {
        for (let dx = 0; dx < bw; dx += 2) {
          const i = ((y + dy) * sw + (x + dx)) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const lum = (r + g + b) / 3;
          const sat = Math.max(r, g, b) - Math.min(r, g, b);
          if (lum > 165 && sat < 45) bright++;
          if (dx + 2 < bw) {
            const j = ((y + dy) * sw + (x + dx + 2)) * 4;
            const lum2 = (data[j] + data[j + 1] + data[j + 2]) / 3;
            if (Math.abs(lum - lum2) > 45) edges++;
          }
          count++;
        }
      }
      const bRatio = bright / count;
      const eRatio = edges / count;
      // 흰 바탕 + 검은 글자 윤곽이 같이 있는 영역만 번호판 후보로 봅니다.
      if (bRatio < 0.30 || eRatio < 0.10) continue;
      const cy = (y + bh / 2) / sh;
      const verticalBonus = cy > 0.45 ? 1 : 0.55; // 번호판은 보통 화면 아래쪽
      const centerBonus = 1 - Math.abs((x + bw / 2) / sw - 0.5) * 0.6;
      const score = (bRatio * 0.8 + Math.min(eRatio, 0.40) * 2.6) * centerBonus * verticalBonus;
      if (score > bestScore) {
        bestScore = score; bestX = x; bestY = y; found = true;
      }
    }
  }
  // 번호판을 못 찾으면(차가 작거나 각도가 심한 사진) 화면 아래 가운데에 기본 배치합니다.
  if (!found) return defaultCorners(img.width, img.height);
  const x1 = bestX / scale, y1 = bestY / scale, pw = bw / scale, ph = bh / scale;
  return [
    { x: x1, y: y1 },
    { x: x1 + pw, y: y1 },
    { x: x1 + pw, y: y1 + ph },
    { x: x1, y: y1 + ph },
  ];
}

// Draw perspective-warped sticker onto target context using subdivided quad mesh
function drawWarpedSticker(targetCtx, corners) {
  if (!stickerImg.complete || !stickerImg.naturalWidth) return;
  const sw = stickerImg.naturalWidth, sh = stickerImg.naturalHeight;
  const N = 12;
  const [p0, p1, p2, p3] = corners;

  function bilerp(u, v) {
    const x = (1 - u) * (1 - v) * p0.x + u * (1 - v) * p1.x + u * v * p2.x + (1 - u) * v * p3.x;
    const y = (1 - u) * (1 - v) * p0.y + u * (1 - v) * p1.y + u * v * p2.y + (1 - u) * v * p3.y;
    return { x, y };
  }

  function drawTri(s0, s1, s2, d0, d1, d2) {
    targetCtx.save();
    targetCtx.beginPath();
    targetCtx.moveTo(d0.x, d0.y);
    targetCtx.lineTo(d1.x, d1.y);
    targetCtx.lineTo(d2.x, d2.y);
    targetCtx.closePath();
    targetCtx.clip();

    const denom = (s0.x * (s1.y - s2.y) + s1.x * (s2.y - s0.y) + s2.x * (s0.y - s1.y));
    if (Math.abs(denom) < 1e-6) { targetCtx.restore(); return; }
    const a = (d0.x * (s1.y - s2.y) + d1.x * (s2.y - s0.y) + d2.x * (s0.y - s1.y)) / denom;
    const b = (d0.y * (s1.y - s2.y) + d1.y * (s2.y - s0.y) + d2.y * (s0.y - s1.y)) / denom;
    const c = (d0.x * (s2.x - s1.x) + d1.x * (s0.x - s2.x) + d2.x * (s1.x - s0.x)) / denom;
    const d = (d0.y * (s2.x - s1.x) + d1.y * (s0.x - s2.x) + d2.y * (s1.x - s0.x)) / denom;
    const e = (d0.x * (s1.x * s2.y - s2.x * s1.y) + d1.x * (s2.x * s0.y - s0.x * s2.y) + d2.x * (s0.x * s1.y - s1.x * s0.y)) / denom;
    const f = (d0.y * (s1.x * s2.y - s2.x * s1.y) + d1.y * (s2.x * s0.y - s0.x * s2.y) + d2.y * (s0.x * s1.y - s1.x * s0.y)) / denom;
    targetCtx.transform(a, b, c, d, e, f);
    targetCtx.drawImage(stickerImg, 0, 0);
    targetCtx.restore();
  }

  for (let iy = 0; iy < N; iy++) {
    const v0 = iy / N, v1 = (iy + 1) / N;
    for (let ix = 0; ix < N; ix++) {
      const u0 = ix / N, u1 = (ix + 1) / N;
      const s00 = { x: u0 * sw, y: v0 * sh }, s10 = { x: u1 * sw, y: v0 * sh };
      const s11 = { x: u1 * sw, y: v1 * sh }, s01 = { x: u0 * sw, y: v1 * sh };
      const d00 = bilerp(u0, v0), d10 = bilerp(u1, v0), d11 = bilerp(u1, v1), d01 = bilerp(u0, v1);
      drawTri(s00, s10, s11, d00, d10, d11);
      drawTri(s00, s11, s01, d00, d11, d01);
    }
  }
}

let previewScale = 1;
function render(withHandles = true) {
  if (currentIdx < 0) return;
  const it = items[currentIdx];
  // 큰 사진은 화면에 보이는 크기까지만 그려 아이폰에서도 드래그가 부드럽게 됩니다. (저장은 원본 화질)
  previewScale = Math.min(1, 2200 / Math.max(it.img.width, it.img.height));
  const k = previewScale;
  canvas.width = Math.max(1, Math.round(it.img.width * k));
  canvas.height = Math.max(1, Math.round(it.img.height * k));
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, it.img.width, it.img.height);
  ctx.drawImage(it.img, 0, 0);
  drawWarpedSticker(ctx, it.corners);

  if (withHandles) {
    ctx.save();
    ctx.strokeStyle = "#3b82f6";
    ctx.lineWidth = Math.max(2, canvas.width / 450) / k;
    ctx.beginPath();
    it.corners.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.stroke();

    const r = Math.max(12, canvas.width / 55) / k;
    it.corners.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(37, 99, 235, 0.9)";
      ctx.fill();
      ctx.lineWidth = Math.max(2, r / 4);
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
    });
    ctx.restore();
  }
  schedulePrep();
}

function renderThumbs() {
  thumbsEl.innerHTML = "";
  items.forEach((it, idx) => {
    const div = document.createElement("div");
    div.className = "thumb" + (idx === currentIdx ? " active" : "") + (it.done ? " done" : "");
    const im = document.createElement("img");
    im.src = it.thumb;
    div.appendChild(im);
    div.onclick = () => { currentIdx = idx; renderThumbs(); render(true); };
    thumbsEl.appendChild(div);
  });
}

function makeThumb(img, size = 140) {
  const c = document.createElement("canvas");
  const ratio = (img.height || img.naturalHeight) / (img.width || img.naturalWidth);
  c.width = size;
  c.height = Math.max(1, Math.round(size * ratio));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.7);
}

function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width) / previewScale,
    y: (clientY - rect.top) * (canvas.height / rect.height) / previewScale,
  };
}

function pointInPoly(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    const intersect = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / ((yj - yi) || 1e-6) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function onDown(e) {
  if (currentIdx < 0) return;
  e.preventDefault();
  const pt = canvasPos(e);
  const it = items[currentIdx];
  const hitR = Math.max(26, canvas.width / 24) / previewScale;
  for (let i = 0; i < 4; i++) {
    const dx = pt.x - it.corners[i].x, dy = pt.y - it.corners[i].y;
    if (Math.hypot(dx, dy) <= hitR) {
      dragMode = { type: "corner", idx: i };
      return;
    }
  }
  if (pointInPoly(pt, it.corners)) {
    dragMode = {
      type: "move", startX: pt.x, startY: pt.y,
      origCorners: it.corners.map(c => ({ x: c.x, y: c.y }))
    };
  }
}

function onMove(e) {
  if (!dragMode || currentIdx < 0) return;
  e.preventDefault();
  const pt = canvasPos(e);
  const it = items[currentIdx];
  if (dragMode.type === "corner") {
    it.corners[dragMode.idx] = { x: pt.x, y: pt.y };
  } else if (dragMode.type === "move") {
    const dx = pt.x - dragMode.startX, dy = pt.y - dragMode.startY;
    it.corners = dragMode.origCorners.map(c => ({ x: c.x + dx, y: c.y + dy }));
  }
  it.done = true;
  it.blob = null;
  render(true);
}

function onUp() {
  if (dragMode) { dragMode = null; renderThumbs(); }
}

canvas.addEventListener("mousedown", onDown);
window.addEventListener("mousemove", onMove);
window.addEventListener("mouseup", onUp);
canvas.addEventListener("touchstart", onDown, { passive: false });
window.addEventListener("touchmove", onMove, { passive: false });
window.addEventListener("touchend", onUp);

document.getElementById("photoInput").addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  for (const file of files) {
    const url = URL.createObjectURL(file);
    const loaded = await new Promise((res) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = url;
    });
    if (!loaded) { toast("읽을 수 없는 사진이 있어요: " + file.name, 3000); continue; }
    const img = limitSize(loaded);
    items.push({ name: file.name.replace(/\.[^.]+$/, ""), img, thumb: makeThumb(img), corners: autoDetectPlate(img), done: false, blob: null });
  }
  if (!items.length) return;
  if (currentIdx < 0) currentIdx = 0;
  emptyBox.style.display = "none";
  canvas.style.display = "block";
  setButtons(true);
  renderThumbs();
  render(true);
});

// 아이폰 사파리에서 큰 사진 여러 장을 다루다 메모리가 터지지 않도록 긴 변을 4096px로 제한
function limitSize(img, max = 4096) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (Math.max(w, h) <= max) return img;
  const scale = max / Math.max(w, h);
  const c = document.createElement("canvas");
  c.width = Math.round(w * scale);
  c.height = Math.round(h * scale);
  const cx = c.getContext("2d");
  cx.imageSmoothingQuality = "high";
  cx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

document.getElementById("stickerInput").addEventListener("change", (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  stickerImg.onload = () => { items.forEach(it => it.blob = null); render(true); };
  stickerImg.src = url;
});

document.getElementById("autoBtn").onclick = () => {
  if (currentIdx < 0) return;
  items[currentIdx].corners = autoDetectPlate(items[currentIdx].img);
  items[currentIdx].blob = null;
  render(true);
};

document.getElementById("resetBtn").onclick = () => {
  if (currentIdx < 0) return;
  const it = items[currentIdx];
  it.corners = defaultCorners(it.img.width, it.img.height);
  it.blob = null;
  render(true);
};

function exportItem(it) {
  const out = document.createElement("canvas");
  out.width = it.img.width; out.height = it.img.height;
  const octx = out.getContext("2d");
  octx.drawImage(it.img, 0, 0);
  drawWarpedSticker(octx, it.corners);
  return new Promise(res => out.toBlob(blob => res(blob), "image/jpeg", 0.94));
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

const toastEl = document.createElement("div");
toastEl.className = "toast";
document.body.appendChild(toastEl);
let toastTimer = null;
function toast(msg, ms = 2600) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
}

function anchorDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  a.style.position = "fixed";
  a.style.left = "-9999px";
  a.textContent = "save";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
}

// iOS 사파리는 <a download>가 막히는 경우가 있어 공유 시트(사진 앱에 저장)를 먼저 씁니다.
async function saveImage(blob, filename, allowShare) {
  if (allowShare && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: "image/jpeg" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return "shared";
      }
    } catch (err) {
      if (err && err.name === "AbortError") return "cancelled";
    }
  }
  anchorDownload(blob, filename);
  return "downloaded";
}

document.getElementById("saveOneBtn").onclick = async () => {
  if (currentIdx < 0) return;
  const it = items[currentIdx];
  // iOS 사파리는 사용자 동작 안에서 바로 공유해야 해서, 미리 만들어 둔 파일이 있으면 그걸 씁니다.
  if (it.blob) {
    saveImage(it.blob, `${it.name}_세차를부탁해.jpg`, true);
    it.done = true;
    renderThumbs();
    return;
  }
  toast("저장 준비 중…", 1200);
  const blob = await exportItem(it);
  await saveImage(blob, `${it.name}_세차를부탁해.jpg`, true);
  it.done = true;
  renderThumbs();
};

document.getElementById("saveAllBtn").onclick = async () => {
  if (isIOS) {
    toast("아이폰은 한 장씩 저장해 주세요. 저장하면 공유창에서 '이미지 저장'을 누르면 사진 앱에 바로 들어갑니다.", 4200);
  }
  for (let i = 0; i < items.length; i++) {
    const blob = await exportItem(items[i]);
    anchorDownload(blob, `${items[i].name}_세차를부탁해.jpg`);
    items[i].done = true;
    await new Promise(r => setTimeout(r, 350));
  }
  renderThumbs();
};
// 미리보기용으로만 쓰는 사본을 만들어 두면, 저장 버튼을 누를 때 기다림 없이 바로 저장됩니다.
let prepTimer = null;
function schedulePrep() {
  clearTimeout(prepTimer);
  prepTimer = setTimeout(async () => {
    if (currentIdx < 0) return;
    const it = items[currentIdx];
    if (it.blob) return;
    try { it.blob = await exportItem(it); } catch (e) { /* 저장 버튼에서 다시 시도 */ }
  }, 500);
}

</script>
</body>
</html>
